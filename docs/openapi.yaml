        features:
          items:
            $ref: '#/components/schemas/Feature'
          type: array
        invoice_when:
          description: |-
            * `invoice_on_attach` - invoice_on_attach
            * `invoice_on_subscription_end` - invoice_on_subscription_end
          enum:
          - invoice_on_attach
          - invoice_on_subscription_end
          readOnly: true
        recurring_charges:
          items:
            $ref: '#/components/schemas/RecurringCharge'
          type: array
        status:
          description: |-
            * `active` - Active
            * `retiring` - Retiring
            * `grandfathered` - Grandfathered
            * `deleted` - Deleted
            * `inactive` - Inactive
            * `not_started` - Not Started
          enum:
          - active
          - deleted
          - grandfathered
          - inactive
          - not_started
          - retiring
          readOnly: true
          type: string
      required:
      - active_instances
      - addon_type
      - billing_frequency
      - components
      - currency
      - features
      - invoice_when
      - recurring_charges
      - status
      type: object
    AddOnVersionUpdate:
      properties:
        active_from:
          format: date-time
          nullable: true
          type: string
        active_to:
          format: date-time
          nullable: true
          type: string
        addon_version_name:
          type: string
      type: object
    AddPlanTags:
      properties:
        message:
          type: string
        success:
          type: boolean
        tags:
          items:
            $ref: '#/components/schemas/Tag'
          type: array
      required:
      - message
      - success
      type: object
