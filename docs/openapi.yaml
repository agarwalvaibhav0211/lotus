        is_new:
          type: boolean
        plan_id:
          description: The Lotus plan_id, found in the billing plan object. This field
            has been deprecated in favor of version_id for the sake of being explicit.
            If used, a best effort will be made to find the correct plan version (matching
            preferred currencies, prioritizing custom plans), but if more than one
