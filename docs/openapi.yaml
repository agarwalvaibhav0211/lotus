    AllSubstitutionResults:
      properties:
        new_plans_revenue:
          format: double
          type: number
        original_plans_revenue:
          format: double
          type: number
        pct_revenue_change:
          format: double
          nullable: true
          type: number
        substitution_results:
          items:
            $ref: '#/components/schemas/SingleSubstitution'
          type: array
      type: object
    AnalysisDetail:
      properties:
        analysis_id:
          type: string
        analysis_name:
          type: string
        analysis_results:
          allOf:
          - $ref: '#/components/schemas/AnalysisResults'
          readOnly: true
        end_date:
          format: date
          type: string
        kpis:
          items:
            description: |-
              * `total_revenue` - Total Revenue
              * `average_revenue` - Average Revenue
              * `new_revenue` - New Revenue
              * `total_cost` - Total Cost
              * `profit` - Profit
              * `churn` - Churn
            enum:
            - average_revenue
            - churn
            - new_revenue
            - profit
            - total_cost
            - total_revenue
            type: string
          type: array
        start_date:
          format: date
          type: string
        status:
          description: |-
            * `running` - Running
            * `completed` - Completed
            * `failed` - Failed
          enum:
          - completed
          - failed
          - running
          type: string
        time_created:
          format: date-time
          type: string
      required:
      - analysis_id
      - analysis_name
      - analysis_results
      - end_date
      - start_date
      type: object
    AnalysisResults:
      properties:
        analysis_summary:
          items:
            $ref: '#/components/schemas/SinglePlanAnalysis'
          type: array
        revenue_by_metric_graph:
          items:
            $ref: '#/components/schemas/RevenueByPlanMetric'
          type: array
        revenue_per_day_graph:
          items:
            $ref: '#/components/schemas/RevenuePerDay'
          type: array
        top_customers_by_plan:
