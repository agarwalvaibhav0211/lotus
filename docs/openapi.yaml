          type: array
      required:
      - analysis_summary
      - revenue_by_metric_graph
      - revenue_per_day_graph
      - top_customers_by_plan
      type: object
    AnalysisSummary:
      properties:
        analysis_id:
          type: string
        analysis_name:
          type: string
        end_date:
          format: date
          type: string
        kpis:
          items:
            description: |-
              * `total_revenue` - Total Revenue
              * `average_revenue` - Average Revenue
              * `new_revenue` - New Revenue
              * `total_cost` - Total Cost
              * `profit` - Profit
              * `churn` - Churn
            enum:
            - average_revenue
            - churn
            - new_revenue
