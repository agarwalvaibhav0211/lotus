info:
  description: Lotus is an open-core pricing and billing engine. We enable API companies
    to automate and optimize their custom usage-based pricing for any metric.
  title: Lotus API
  version: 0.9.3
openapi: 3.0.3
paths:
  /api/addons/:
    get:
      operationId: apiAddonsList
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AddOn'
                type: array
          description: ''
      security:
      - knoxTokenAuth: []
      - OrganizationApiKeyAuth: []
        TokenAuth: []
      tags:
      - api
  /api/addons/{plan_id}/:
    get:
      operationId: apiAddonsRetrieve
      parameters:
      - in: path
        name: plan_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOn'
          description: ''
      security:
      - knoxTokenAuth: []
      - OrganizationApiKeyAuth: []
        TokenAuth: []
      tags:
      - api
  /api/credits/:
    get:
      operationId: apiCreditsList
      parameters:
      - description: Filter to adjustments in a specific currency
        in: query
        name: currency_code
        schema:
          minLength: 1
          type: string
      - description: The id provided when creating the customer, we suggest matching
          with your internal customer id in your backend
        in: query
        name: customer_id
        required: true
        schema:
          minLength: 1
          nullable: true
          type: string
      - description: Filter to adjustments that are effective after this date
        in: query
        name: effective_after
        schema:
          format: date-time
          type: string
      - description: Filter to adjustments that are effective before this date
        in: query
        name: effective_before
        schema:
          format: date-time
          type: string
      - description: Filter to adjustments that expire after this date
        in: query
        name: expires_after
        schema:
          format: date-time
          type: string
      - description: Filter to adjustments that expire before this date
        in: query
        name: expires_before
        schema:
          format: date-time
          type: string
      - description: Filter to adjustments that were issued after this date
        in: query
        name: issued_after
        schema:
          format: date-time
          type: string
      - description: Filter to adjustments that were issued before this date
        in: query
        name: issued_before
        schema:
          format: date-time
          type: string
      - description: Filter to a specific set of adjustment statuses. Defaults to
          both active and inactive.
        in: query
        name: status
        schema:
          default:
          - active
          - inactive
          items:
            description: |-
              * `active` - Active
              * `inactive` - Inactive
            enum:
            - active
            - inactive
