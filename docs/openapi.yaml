    OrganizationCreateRequest:
      properties:
        default_currency_code:
          minLength: 1
          type: string
        organization_name:
          minLength: 1
          type: string
        organization_type:
          default: development
          description: |-
            * `development` - development
            * `production` - production
          enum:
          - development
          - production
          type: string
      required:
      - organization_name
      type: object
    OrganizationUser:
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        role:
          readOnly: true
          type: string
        status:
          default: Active
          description: |-
            * `Active` - Active
            * `Invited` - Invited
          enum:
          - Active
          - Invited
          type: string
        username:
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          maxLength: 150
          pattern: ^[\w.@+-]+$
          type: string
      required:
      - email
      - role
      - username
      type: object
