components:
  schemas:
    APIToken:
      properties:
        created:
          format: date-time
          readOnly: true
          type: string
        expiry_date:
          description: Once API key expires, clients cannot use it anymore.
          format: date-time
          nullable: true
          title: Expires
          type: string
        name:
          description: A free-form name for the API key. Need not be unique. 50 characters
            max.
          maxLength: 50
          type: string
        prefix:
          readOnly: true
          type: string
      required:
      - created
      - prefix
      type: object
    APITokenCreateResponse:
      properties:
        api_key:
          $ref: '#/components/schemas/APIToken'
        key:
          type: string
      required:
      - api_key
      - key
      type: object
    APITokenRequest:
      properties:
        expiry_date:
          description: Once API key expires, clients cannot use it anymore.
          format: date-time
          nullable: true
          title: Expires
          type: string
        name:
          description: A free-form name for the API key. Need not be unique. 50 characters
            max.
          maxLength: 50
          minLength: 1
          type: string
      type: object
    APITokenRollResponse:
      properties:
        api_key:
          $ref: '#/components/schemas/APIToken'
        key:
          type: string
      required:
      - api_key
      - key
      type: object
    AccessMethodsSubscriptionRecord:
      properties:
        end_date:
          description: The time the subscription starts. This will be a string in
            yyyy-mm-dd HH:mm:ss format in UTC time.
          format: date-time
          readOnly: true
          type: string
        plan:
          $ref: '#/components/schemas/LightweightPlanVersion'
        start_date:
          description: The time the subscription starts. This will be a string in
            yyyy-mm-dd HH:mm:ss format in UTC time.
          format: date-time
          readOnly: true
          type: string
        subscription_filters:
          items:
            $ref: '#/components/schemas/SubscriptionFilter'
          type: array
      required:
      - end_date
      - plan
      - start_date
      - subscription_filters
      type: object
    Action:
      description: DRF serializer for :class:`~activity.models.Action`.
      properties:
        action_object:
          additionalProperties: {}
          readOnly: true
          type: object
        actor:
          additionalProperties: {}
          readOnly: true
          type: object
        description:
          nullable: true
          type: string
        id:
          readOnly: true
          type: integer
        public:
          type: boolean
        target:
          additionalProperties: {}
          readOnly: true
          type: object
        timestamp:
          format: date-time
          type: string
        verb:
          maxLength: 255
          type: string
      required:
      - action_object
      - actor
      - id
      - target
      - verb
      type: object
    AddFeatureRequest:
      properties:
        feature_id:
          description: The feature_id of the feature you want to add to the plan.
          format: uuid
          type: string
      required:
      - feature_id
      type: object
    AddFeatureResponse:
      properties:
        message:
          type: string
        success:
          type: boolean
      required:
      - message
      - success
      type: object
    AddFeatureToAddOnRequest:
      properties:
        feature_id:
          description: The feature_id of the feature you want to add to the plan.
          format: uuid
          type: string
        version_ids:
          description: The version_ids of the AddOn versions you want to add the feature
            to. If you want to apply to all versions, use the all_versions parameter.
          items:
            format: uuid
            type: string
          type: array
      required:
      - feature_id
      type: object
    AddFeatureToAddOnResponse:
      properties:
        message:
          type: string
        success:
          type: boolean
      required:
      - message
      - success
      type: object
    AddFeatureToPlanRequest:
      properties:
        all_versions:
          default: false
          description: Whether or not to apply this feature to all versions of the
            feature. If you want to apply to specific versions, use the version_ids
            parameter.
          type: boolean
        feature_id:
          description: The feature_id of the feature you want to add to the plan.
          format: uuid
          type: string
        version_ids:
          description: The version_ids of the plan versions you want to add the feature
            to. If you want to apply to all versions, use the all_versions parameter.
          items:
            format: uuid
            type: string
          type: array
      required:
      - feature_id
      type: object
    AddFeatureToPlanResponse:
      properties:
        message:
          type: string
        success:
          type: boolean
      required:
      - message
      - success
      type: object
    AddFeatureToPlanVersionNumberResponse:
      properties:
        message:
          type: string
        success:
          type: boolean
      required:
      - message
      - success
      type: object
    AddOn:
      properties:
        active_instances:
          deprecated: true
          description: The number of active instances of the add-on plan.
          readOnly: true
          type: integer
        addon_description:
          description: The description of the add-on plan.
          type: string
        addon_id:
          description: The ID of the add-on plan.
          type: string
        addon_name:
          description: The name of the add-on plan.
          type: string
        addon_type:
          deprecated: true
          enum:
          - flat
          - usage_based
          readOnly: true
          type: string
        billing_frequency:
          deprecated: true
          description: |-
            * `one_time` - one_time
            * `recurring` - recurring
          enum:
          - one_time
          - recurring
          readOnly: true
        components:
          deprecated: true
          items:
            $ref: '#/components/schemas/PlanComponent'
          readOnly: true
          type: array
        currency:
          allOf:
          - $ref: '#/components/schemas/PricingUnit'
          deprecated: true
          readOnly: true
        features:
          deprecated: true
          items:
            $ref: '#/components/schemas/Feature'
          readOnly: true
          type: array
        flat_rate:
          deprecated: true
          exclusiveMaximum: true
          format: double
          maximum: 10000000000
          minimum: 0
          readOnly: true
          type: number
        invoice_when:
          deprecated: true
          description: |-
            * `invoice_on_attach` - invoice_on_attach
            * `invoice_on_subscription_end` - invoice_on_subscription_end
          enum:
          - invoice_on_attach
          - invoice_on_subscription_end
          readOnly: true
        versions:
          description: This addon's versions.
          items:
            $ref: '#/components/schemas/AddOnVersion'
          type: array
      required:
      - active_instances
      - addon_description
      - addon_id
      - addon_name
      - addon_type
      - billing_frequency
      - components
      - currency
      - features
      - flat_rate
      - invoice_when
      - versions
      type: object
    AddOnCreateRequest:
      properties:
        addon_description:
          description: The description of the add-on plan.
          minLength: 1
          type: string
        addon_name:
          description: The name of the add-on plan.
          minLength: 1
          type: string
        initial_version:
          allOf:
          - $ref: '#/components/schemas/InitialAddOnVersionCreateRequest'
          description: The initial version of the add-on plan.
      required:
      - addon_description
      - addon_name
      - initial_version
      type: object
    AddOnDetail:
      properties:
        addon_description:
          description: The description of the add-on plan.
          type: string
        addon_id:
          description: The ID of the add-on plan.
          type: string
        addon_name:
          description: The name of the add-on plan.
          type: string
        versions:
          description: This addon's versions.
          items:
            $ref: '#/components/schemas/AddOnVersion'
          type: array
      required:
      - addon_description
      - addon_id
      - addon_name
      - versions
      type: object
    AddOnSubscriptionRecord:
      properties:
        addon:
          $ref: '#/components/schemas/LightweightAddOn'
        addon_subscription_id:
          type: string
        auto_renew:
          description: Whether the subscription automatically renews. Defaults to
            true.
          readOnly: true
          type: boolean
        customer:
          $ref: '#/components/schemas/LightweightCustomer'
        end_date:
          description: The time the subscription starts. This will be a string in
            yyyy-mm-dd HH:mm:ss format in UTC time.
          format: date-time
          readOnly: true
          type: string
        fully_billed:
          readOnly: true
          type: boolean
        metadata:
          additionalProperties: {}
          readOnly: true
          type: object
        parent:
          $ref: '#/components/schemas/LightweightSubscriptionRecord'
        start_date:
          description: The time the subscription starts. This will be a string in
            yyyy-mm-dd HH:mm:ss format in UTC time.
          format: date-time
          readOnly: true
          type: string
      required:
      - addon
      - addon_subscription_id
      - auto_renew
      - customer
      - end_date
      - fully_billed
      - metadata
      - parent
      - start_date
      type: object
    AddOnSubscriptionRecordCreateRequest:
      properties:
        addon_id:
          description: 'The add-on to be applied to the subscription. '
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          description: A JSON object containing additional information about the add-on
            subscription. This will be returned in the response when you retrieve
            the add-on subscription.
          type: object
        quantity:
          default: 1
          description: The quantity of the add-on to be applied to the subscription.
            Flat fees of add-ons will be multiplied by this quantity. Usage-based
            components of add-ons will be unaffected by the quantity.
          minimum: 1
          type: integer
      type: object
    AddOnUpdate:
      properties:
        active_from:
          format: date-time
          type: string
        active_to:
          format: date-time
          nullable: true
          type: string
        addon_name:
          type: string
      type: object
    AddOnVersion:
      properties:
        active_instances:
          description: The number of active instances of this version of the add-on
            plan.
          readOnly: true
          type: integer
        addon_type:
          enum:
          - flat
          - usage_based
          readOnly: true
          type: string
        billing_frequency:
          description: |-
            * `one_time` - one_time
            * `recurring` - recurring
          enum:
          - one_time
          - recurring
          readOnly: true
        components:
          items:
            $ref: '#/components/schemas/PlanComponent'
          type: array
        currency:
          allOf:
          - $ref: '#/components/schemas/PricingUnit'
          description: Currency of the plan. Can only be null if the flat fee is 0
            and all components are of type free.
        features:
          items:
            $ref: '#/components/schemas/Feature'
          type: array
        invoice_when:
          description: |-
            * `invoice_on_attach` - invoice_on_attach
            * `invoice_on_subscription_end` - invoice_on_subscription_end
          enum:
          - invoice_on_attach
          - invoice_on_subscription_end
          readOnly: true
        recurring_charges:
          items:
            $ref: '#/components/schemas/RecurringCharge'
          type: array
        status:
          description: |-
            * `active` - Active
            * `retiring` - Retiring
            * `grandfathered` - Grandfathered
            * `deleted` - Deleted
            * `inactive` - Inactive
            * `not_started` - Not Started
          enum:
          - active
          - deleted
          - grandfathered
          - inactive
          - not_started
          - retiring
          readOnly: true
          type: string
      required:
      - active_instances
      - addon_type
      - billing_frequency
      - components
      - currency
      - features
      - invoice_when
      - recurring_charges
      - status
      type: object
    AddOnVersionCreateRequest:
      properties:
        addon_id:
          format: uuid
          type: string
        billing_frequency:
          description: |-
            * `one_time` - one_time
            * `recurring` - recurring
          enum:
          - one_time
          - recurring
        components:
          items:
            $ref: '#/components/schemas/PlanComponentCreateRequest'
          nullable: true
          type: array
        currency_code:
          minLength: 1
          type: string
        features:
          items:
            format: uuid
            type: string
          type: array
        invoice_when:
          description: |-
            * `invoice_on_attach` - invoice_on_attach
            * `invoice_on_subscription_end` - invoice_on_subscription_end
          enum:
          - invoice_on_attach
          - invoice_on_subscription_end
        recurring_charges:
          items:
            $ref: '#/components/schemas/RecurringChargeCreateRequest'
          nullable: true
          type: array
      required:
      - addon_id
      - billing_frequency
      - currency_code
      - invoice_when
      type: object
    AddOnVersionDetail:
      properties:
        active_instances:
          description: The number of active instances of this version of the add-on
            plan.
          readOnly: true
          type: integer
        addon_type:
          enum:
          - flat
          - usage_based
          readOnly: true
          type: string
        billing_frequency:
          description: |-
            * `one_time` - one_time
            * `recurring` - recurring
          enum:
          - one_time
          - recurring
          readOnly: true
        components:
          items:
            $ref: '#/components/schemas/PlanComponent'
          type: array
        currency:
          allOf:
          - $ref: '#/components/schemas/PricingUnit'
          description: Currency of the plan. Can only be null if the flat fee is 0
