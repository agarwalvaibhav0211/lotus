networks:
  caddy_net:
    external: true
    name: caddy_net
  # Per-stack broker network. Each stack gets its own so that the identical
  # service names in dev and prod can never resolve to each other.
  shared-services-prod:
    external: true
    name: shared-services-prod
  lotus-internal:
    driver: bridge

services:
  db:
    image: timescale/timescaledb:latest-pg14
    restart: unless-stopped
    expose:
      - 5432
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    env_file:
      - ./env/.env.prod
    networks:
      - lotus-internal

  svix-server:
    image: svix/svix-server:v1.38
    environment:
      WAIT_FOR: "true"
      SVIX_REDIS_DSN: redis://redis
      SVIX_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db
    env_file:
      - ./env/.env.prod
    expose:
      - 8071
    depends_on:
    - db
    - redis
    links:
    - db
    - redis
    restart: unless-stopped
    networks:
      - lotus-internal

  redpanda:
    # Opt-in: this stack normally reaches the central Redpanda in
    # oracle-cloud-setup over the shared-services-prod network.
    # `docker compose --profile local-redpanda up` to run a bundled one instead.
    profiles: ["local-redpanda"]
    image: docker.redpanda.com/redpandadata/redpanda:v22.2.2
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --memory 400M
      - --reserve-memory 0M
    expose:
      - 8081
      - 8082
      - 9092
      - 9644
      - 29092
    volumes:
      - redpanda_prod:/var/lib/redpanda/data
    restart: unless-stopped
    networks:
      - lotus-internal

  backend: &backend
    image: ${LOTUS_IMAGE_REGISTRY:-ghcr.io/agarwalvaibhav0211/lotus}/backend:${LOTUS_IMAGE_TAG:-latest}
    pull_policy: ${LOTUS_IMAGE_PULL_POLICY:-missing}
    env_file:
      - ./env/.env.prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    expose:
      - 8000
    volumes:
      - django_static_volume:/lotus/staticfiles
    command: sh -c "./scripts/start_backend.prod.sh"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - lotus-internal
      - shared-services-prod

  event-guidance:
    image: ${LOTUS_IMAGE_REGISTRY:-ghcr.io/agarwalvaibhav0211/lotus}/event-guidance:${LOTUS_IMAGE_TAG:-latest}
    pull_policy: ${LOTUS_IMAGE_PULL_POLICY:-missing}
    env_file:
      - ./env/.env.prod
    build:
      context: ./go/event-guidance
      dockerfile: Dockerfile
    expose:
      - 7999
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - lotus-internal
      - shared-services-prod

  event-ingestion:
    image: ${LOTUS_IMAGE_REGISTRY:-ghcr.io/agarwalvaibhav0211/lotus}/event-ingestion:${LOTUS_IMAGE_TAG:-latest}
    pull_policy: ${LOTUS_IMAGE_PULL_POLICY:-missing}
    env_file:
      - ./env/.env.prod
    build:
      context: ./go/event-ingestion
      dockerfile: Dockerfile
    expose:
      - 7998
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped
    networks:
      - lotus-internal
      - shared-services-prod

  frontend:
    image: ${LOTUS_IMAGE_REGISTRY:-ghcr.io/agarwalvaibhav0211/lotus}/frontend:${LOTUS_IMAGE_TAG:-latest}
    pull_policy: ${LOTUS_IMAGE_PULL_POLICY:-missing}
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./env/.env.prod
    stdin_open: true
    expose:
      - 80
    volumes:
      - django_static_volume:/app/backend/server/django_staticfiles
    depends_on:
      - backend
    networks:
      # frontend is the ONLY service that may join caddy_net. Its nginx proxies
      # to the bare names `backend:8000` and `event-ingestion:7998`, and Compose
      # publishes every service's name as a DNS alias on each network it joins —
      # so any other stack putting a service called `backend` on caddy_net makes
      # that lookup ambiguous and can silently steer this stack at the wrong
      # database. Keep everything else on lotus-internal / shared-services-prod.
      - caddy_net
      - lotus-internal  # needs both to reach backend/event-ingestion internally

  redis:
    image: redis:7-alpine
    command: redis-server
    restart: unless-stopped
    env_file:
      - ./env/.env.prod
    networks:
      - lotus-internal

  celery:
    image: ${LOTUS_IMAGE_REGISTRY:-ghcr.io/agarwalvaibhav0211/lotus}/backend:${LOTUS_IMAGE_TAG:-latest}
    pull_policy: ${LOTUS_IMAGE_PULL_POLICY:-missing}
    env_file:
      - ./env/.env.prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: bash -c "while ! nc -q 1 db 5432 </dev/null; do sleep 5; done; celery -A lotus worker -l info;"
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - lotus-internal
      - shared-services-prod

  celery-beat:
    image: ${LOTUS_IMAGE_REGISTRY:-ghcr.io/agarwalvaibhav0211/lotus}/backend:${LOTUS_IMAGE_TAG:-latest}
    pull_policy: ${LOTUS_IMAGE_PULL_POLICY:-missing}
    env_file:
      - ./env/.env.prod
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: bash -c "while ! nc -q 1 db 5432 </dev/null; do sleep 5; done; celery -A lotus beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler;"
    depends_on:
      - celery
      - backend
      - redis
    networks:
      - lotus-internal
      - shared-services-prod

volumes:
  pgdata_prod:
  django_static_volume:
  redpanda_prod:
