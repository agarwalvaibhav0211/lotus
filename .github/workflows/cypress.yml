name: Cypress Tests

on:
  pull_request:
    branches: ["main"]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: lotus
          POSTGRES_PASSWORD: lotus
          SSLMODE: PREFER
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis
        ports:
          - 6379:6379
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: Development

    env:
      DJANGO_SETTINGS_MODULE: "lotus.settings"
      PYTHONPATH: "."
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      DEBUG: False
      KAFKA_URL: "localhost:9092"
      PYTHONDONTWRITEBYTECODE: 1
      VITE_API_URL: "http://localhost:8000/"
      ADMIN_EMAIL: "change_me@change_me.com"
      ADMIN_PASSWORD: "change_me"
      ADMIN_USERNAME: "change_me"

    steps:
      - uses: actions/checkout@v4

      - name: start redpanda
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v22.2.2 \
            redpanda start --overprovisioned --smp 1 --memory 1G \
            --reserve-memory 0M --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://localhost:9092

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install poetry
        run: |
          cd ./backend && python -m pip install --upgrade poetry wheel

      - id: cache-poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install system dependencies
        run: sudo apt-get install -y libcairo2-dev

      - name: Install backend dependencies
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          cd ./backend && poetry install --no-root

      - name: Migrate
        run: |
          cd ./backend && poetry run python manage.py migrate --noinput

      - name: Demo up
        run: |
          cd ./backend && poetry run python manage.py demo_up

      - name: Init Admin
        run: |
          cd ./backend && poetry run python manage.py initadmin

      - name: Run Django server
        run: |
          cd ./backend && poetry run python manage.py runserver 0.0.0.0:8000 &

      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          working-directory: ./frontend
          start: yarn run dev --port 3000 --host 127.0.0.1
          wait-on: "http://localhost:8000/api/healthcheck/, http://localhost:3000"
