name: Tag Release Images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  tag-release:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image registry
        id: vars
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Retag images with release version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          REGISTRY="${{ steps.vars.outputs.registry }}"
          SHA="sha-${{ github.sha }}"
          for service in backend frontend event-guidance event-ingestion; do
            docker buildx imagetools create \
              --tag "${REGISTRY}/${service}:${VERSION}" \
              "${REGISTRY}/${service}:${SHA}"
          done
