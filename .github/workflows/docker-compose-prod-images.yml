name: Build and Push Production Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  COMPOSE_FILE: docker-compose.prod.yaml:docker-compose.prod.images.yaml
  IMAGE_TAG: sha-${{ github.sha }}
  POSTGRES_USER: lotus
  POSTGRES_PASSWORD: lotus

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Prepare compose env file
        run: cp env/.env.prod.example env/.env.prod

      - name: Create production image override
        run: |
          printf '%s\n' \
            'services:' \
            '  backend:' \
            "    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}" \
            '  celery:' \
            "    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}" \
            '  celery-beat:' \
            "    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}" \
            '  event-guidance:' \
            "    image: ${IMAGE_PREFIX}/event-guidance:${IMAGE_TAG}" \
            '  event-ingestion:' \
            "    image: ${IMAGE_PREFIX}/event-ingestion:${IMAGE_TAG}" \
            '  frontend:' \
            "    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}" \
            > docker-compose.prod.images.yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production images
        run: docker compose build backend event-guidance event-ingestion frontend

      - name: Push production images
        run: docker compose push backend event-guidance event-ingestion frontend

      - name: Tag images as latest
        if: github.ref == 'refs/heads/main'
        run: |
          for image in backend event-guidance event-ingestion frontend; do
            docker tag "${IMAGE_PREFIX}/${image}:${IMAGE_TAG}" "${IMAGE_PREFIX}/${image}:latest"
            docker push "${IMAGE_PREFIX}/${image}:latest"
          done
