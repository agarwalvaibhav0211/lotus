name: Build and Push Production Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image registry
        id: vars
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/backend:sha-${{ github.sha }}
            ${{ steps.vars.outputs.registry }}/backend:latest
          cache-from: type=registry,ref=${{ steps.vars.outputs.registry }}/backend:cache
          cache-to: type=registry,ref=${{ steps.vars.outputs.registry }}/backend:cache,mode=max,image-manifest=true

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/frontend:sha-${{ github.sha }}
            ${{ steps.vars.outputs.registry }}/frontend:latest
          cache-from: type=registry,ref=${{ steps.vars.outputs.registry }}/frontend:cache
          cache-to: type=registry,ref=${{ steps.vars.outputs.registry }}/frontend:cache,mode=max,image-manifest=true

      - name: Build and push event-guidance
        uses: docker/build-push-action@v6
        with:
          context: ./go/event-guidance
          file: ./go/event-guidance/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/event-guidance:sha-${{ github.sha }}
            ${{ steps.vars.outputs.registry }}/event-guidance:latest
          cache-from: type=registry,ref=${{ steps.vars.outputs.registry }}/event-guidance:cache
          cache-to: type=registry,ref=${{ steps.vars.outputs.registry }}/event-guidance:cache,mode=max,image-manifest=true

      - name: Build and push event-ingestion
        uses: docker/build-push-action@v6
        with:
          context: ./go/event-ingestion
          file: ./go/event-ingestion/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/event-ingestion:sha-${{ github.sha }}
            ${{ steps.vars.outputs.registry }}/event-ingestion:latest
          cache-from: type=registry,ref=${{ steps.vars.outputs.registry }}/event-ingestion:cache
          cache-to: type=registry,ref=${{ steps.vars.outputs.registry }}/event-ingestion:cache,mode=max,image-manifest=true
