name: Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: lotus
          POSTGRES_PASSWORD: lotus
          SSLMODE: PREFER
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis
        ports:
          - 6379:6379
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: Development

    env:
      DJANGO_SETTINGS_MODULE: "lotus.settings"
      PYTHONPATH: "."
      SECRET_KEY: "${{ secrets.SECRET_KEY }}"
      STRIPE_LIVE_SECRET_KEY: "${{ secrets.STRIPE_LIVE_SECRET_KEY }}"
      STRIPE_TEST_SECRET_KEY: "${{ secrets.STRIPE_TEST_SECRET_KEY }}"
      DEBUG: False
      KAFKA_URL: "localhost:9092"
      PYTHONDONTWRITEBYTECODE: 1
      SELF_HOSTED: "${{ secrets.SELF_HOSTED }}"

    steps:
      - uses: actions/checkout@v4

      - name: start redpanda
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v22.2.2 \
            redpanda start --overprovisioned --smp 1 --memory 1G \
            --reserve-memory 0M --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://localhost:9092

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install poetry
        run: |
          python -m pip install --upgrade poetry wheel

      - id: cache-poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev postgresql-client

      - name: Install dependencies
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          poetry install --no-root

      - name: Create TimescaleDB template database
        run: |
          psql -h localhost -U lotus -c "CREATE DATABASE template_timescale;"
          psql -h localhost -U lotus -d template_timescale -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
          psql -h localhost -U lotus -c "UPDATE pg_database SET datistemplate = true WHERE datname = 'template_timescale';"
          psql -h localhost -U lotus -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'template_timescale' AND pid <> pg_backend_pid();"
          psql -h localhost -U lotus -c "UPDATE pg_database SET datallowconn = false WHERE datname = 'template_timescale';"
        env:
          PGPASSWORD: lotus

      - name: Migrate
        run: |
          poetry run python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          for i in 1 2 3; do
            if poetry run pytest -x --cov=. --cov-report term-missing --cov-fail-under=30; then
              export PYTEST_COVERAGE_SUCCEEDED=true
              break
            else
              export PYTEST_COVERAGE_SUCCEEDED=false
            fi
            sleep 5s
          done 
          if [[ "${PYTEST_COVERAGE_SUCCEEDED}" == "true" ]]; then
            echo "Pytest succeeded"
          else
            echo "Pytest failed"
            exit 1
          fi
        env:
          RETRY_DESCRIPTION: "Running tests with coverage"

      - name: Test Setup Tasks
        run: |
          poetry run python manage.py setup_tasks
