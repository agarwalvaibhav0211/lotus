services:
  db:
    image: timescale/timescaledb:latest-pg14
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    env_file:
      - ./env/.env.dev

  redis:
    image: redis:7-alpine
    command: redis-server
    env_file:
      - ./env/.env.dev
    restart: unless-stopped

  redpanda:
    # Opt-in: this stack normally reaches the central Redpanda in
    # oracle-cloud-setup over the shared-services network.
    # `docker compose --profile local-redpanda up` to run a bundled one instead.
    profiles: ["local-redpanda"]
    image: docker.redpanda.com/redpandadata/redpanda:v22.2.2
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - 8081:8081
      - 8082:8082
      - 9092:9092
      - 9644:9644
      - 29092:29092
    volumes:
      - redpanda_dev:/var/lib/redpanda/data
    restart: unless-stopped

  svix-server:
    image: svix/svix-server:v1.38
    environment:
      WAIT_FOR: "true"
      SVIX_REDIS_DSN: redis://redis
      SVIX_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db
    env_file:
      - ./env/.env.dev
    ports:
      - "8071:8071"
    depends_on:
      - db
      - redis
    links:
      - db
      - redis
    restart: unless-stopped

  backend:
    &backend
    container_name: lotus-backend
    env_file:
      - ./env/.env.dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend/lotus:/lotus/lotus
      - ./backend/metering_billing:/lotus/metering_billing
      - ./backend/api:/lotus/api
    command: sh -c "./scripts/start_backend.dev.sh"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - default
      # NOT caddy_net. Caddy only ever proxies to the frontend, and Compose
      # publishes each service's *name* as a DNS alias on every network it
      # joins — so putting this on the shared proxy network claimed the generic
      # name "backend" there. The prod frontend also sits on caddy_net and
      # resolves `backend:8000`, so it silently reached this dev container
      # instead of its own, i.e. prod served dev's database.
      - shared-services

  event-guidance:
    env_file:
      - ./env/.env.dev
    build:
      context: ./go/event-guidance
      dockerfile: Dockerfile
    ports:
      - 7999:7999
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped
    networks:
      - default
      - shared-services

  event-ingestion:
    container_name: lotus-event-ingestion
    env_file:
      - ./env/.env.dev
    build:
      context: ./go/event-ingestion
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped
    networks:
      - default
      # NOT caddy_net — same reason as backend above: it claimed the generic
      # alias "event-ingestion" on the shared proxy network, which the prod
      # frontend resolves for its ingestion upstream.
      - shared-services

  frontend:
    container_name: lotus-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./env/.env.dev
    command: yarn run dev --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend/src:/frontend/src:delegated
      - ./frontend/public:/frontend/public:delegated
      - ./frontend/vite.config.ts:/frontend/vite.config.ts:delegated
      - /frontend/node_modules/
    stdin_open: true
    depends_on:
      - backend
    networks:
      - default
      - caddy_net

  celery:
    env_file:
      - ./env/.env.dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: bash -c "while ! nc -q 1 db 5432 </dev/null; do sleep 5; done; celery -A lotus worker -l info;"
    depends_on:
      - redis
      - backend
    volumes:
      - ./backend/lotus:/lotus/lotus
      - ./backend/metering_billing:/lotus/metering_billing
      - ./backend/api:/lotus/api
    restart: unless-stopped
    networks:
      - default
      - shared-services

  celery-beat:
    env_file:
      - ./env/.env.dev
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend/lotus:/lotus/lotus
      - ./backend/metering_billing:/lotus/metering_billing
      - ./backend/api:/lotus/api
    command: bash -c "while ! nc -q 1 db 5432 </dev/null; do sleep 5; done; celery -A lotus beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler;"
    depends_on:
      - celery
      - backend
      - redis
    networks:
      - default
      - shared-services

volumes:
  pgdata_dev:
  redpanda_dev:

networks:
  default:
    name: lotus_default
  caddy_net:
    external: true
    name: caddy_net
  shared-services:
    external: true
    name: shared-services
